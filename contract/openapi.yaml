openapi: 3.1.0
info:
  title: Stockwise API
  version: 0.3.0
  summary: Stock and customer-credit ledger for one demonstration shop (TeSA Cohort 6, Team 3).
  description: |
    Contract v0.1 covers the **Monday 26 Oct MVP paths only** (EXECUTION.md step 2).
    v0.2.0 adds only optional, backward-compatible features (sdlc/contract-v0-2):
    - optional `Idempotency-Key` on `POST /customers` (proposal A);
    - specified customer search ordering and `asOf` on `CustomerPage` (proposal B);
    - safe integer bounds on money (`Kobo` maximum 9007199254740991) (proposal C);
    - `GET /product-categories` and optional `active` query filter on `GET /products` (proposal D).
    v0.2.0 also adds read-only product movements, customer ledger history and dashboard endpoints.
    v0.3.0 adds restock recording and history (R6):
    - `POST /restocks`, OWNER-only and idempotent via a required `Idempotency-Key`;
    - `GET /restocks`, with optional product filtering and stable newest-first pagination.
    A v0.1.0 client keeps working unchanged.
    Remaining paths (repayments, reversals, product edit/archive) are added in later versions,
    each logged in `decisions.md` §3.

    Conventions:
    - Every money field is an integer number of **kobo** (`x-unit: kobo`). ₦450.00 is `45000`.
      Non-integer numbers are rejected with 400.
    - Every error is `application/problem+json` (RFC 9457) with a machine-readable `code`
      and the `requestId`.
    - Send `X-Request-Id` (UUID) on every request; the service echoes it (and generates one if absent).
    - Recording writes (`POST /sales`, `POST /restocks`) require an `Idempotency-Key` (UUID). Replaying the same key with
      the same body returns the original result; the same key with a different body returns 422.
      `POST /customers` accepts the same header optionally (v0.2.0).
    - All timestamps are UTC (RFC 3339). "Today" filters use the Africa/Lagos day.
    - All data is fictional demonstration data.
  contact:
    name: Team 3 (Isaac Bassey, API and access owner)
servers:
  - url: http://127.0.0.1:4710
    description: Prism mock (`npx @stoplight/prism-cli@5 mock contract/openapi.yaml --port 4710`)
  - url: http://localhost:8080/api/v1
    description: Local service
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Login and current user
  - name: products
    description: Product catalogue
  - name: customers
    description: Customers who buy on credit
  - name: sales
    description: Paid and credit sales (the stock-protected rule)
  - name: restocks
    description: Stock received from suppliers
  - name: dashboard
    description: Today's figures, computed when read
  - name: health
    description: Liveness

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness and database reachability
      description: Safe. Public.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Service and database are up
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/sessions:
    post:
      tags: [auth]
      operationId: createSession
      summary: Log in with email and password
      description: Neither safe nor idempotent. Public. Returns an 8-hour bearer token (DM15).
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Logged in
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: The logged-in user and their role
      description: Safe. Any role.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Current user
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products:
    get:
      tags: [products]
      operationId: listProducts
      summary: List and filter products
      description: Safe. Any role. Filters combine; omit a filter to clear it.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: q
          in: query
          description: Keyword matched against name or reference (case-insensitive).
          schema:
            type: string
            maxLength: 100
        - name: category
          in: query
          schema:
            type: string
            maxLength: 60
        - name: active
          in: query
          description: Filter by active status (true for active only, false for archived/inactive only). Omit to include both active and inactive products.
          schema:
            type: boolean
        - name: stockState
          in: query
          description: Omit to list every product, archived ones included.
          schema:
            $ref: '#/components/schemas/StockState'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of products
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [products]
      operationId: createProduct
      summary: Add a product
      description: Neither safe nor idempotent. OWNER only.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Product created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              description: URL of the new product
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`DUPLICATE_REFERENCE`: a product with this reference already exists'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /products/{productId}:
    get:
      tags: [products]
      operationId: getProduct
      summary: One product
      description: Safe. Any role.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The product
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              description: Current version, for later conditional updates (`If-Match`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/{productId}/movements:
    get:
      tags: [products]
      operationId: listProductMovements
      summary: A product's stock movement history
      description: |
        Safe. Any role. Every change to the product's stock (opening stock, sales, restocks and their
        reversals), newest first. Each entry carries `quantityAfter`, the running total right after it,
        computed over the whole history before paging, so the newest entry's `quantityAfter` equals
        `currentQuantity` (spec R13). Archived products have a history too.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of the product's movements
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /product-categories:
    get:
      tags: [products]
      operationId: listProductCategories
      summary: List distinct product categories
      description: Safe. Any role. Returns all distinct non-empty product categories in case-insensitive alphabetical order.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Distinct product categories in case-insensitive alphabetical order
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /restocks:
    get:
      tags: [restocks]
      operationId: listRestocks
      summary: List recorded restocks
      description: Safe. Any authenticated role. Newest first, with UUID as the stable tie-breaker.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: productId
          in: query
          description: Return restocks for one product only.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of restocks
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestockPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [restocks]
      operationId: createRestock
      summary: Record stock received
      description: |
        **Idempotent via `Idempotency-Key`** (required). OWNER only.

        In one transaction the service claims the key, increases the product quantity, increments
        its version, records the immutable restock and appends a `RESTOCK` stock movement. The
        `receivedOn` date records when the stock arrived; `createdAt` records when Stockwise saved it.

        Client's part: generate one UUID for the confirmed attempt and keep the same body and key
        until a definitive response arrives. A replay by the same user with the same normalized body
        returns the original 201 response without increasing stock again. A different body or user
        with that key gets 422 `IDEMPOTENCY_KEY_REUSED`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestockCreate'
      responses:
        '201':
          description: Restock recorded (or the original result of a replayed key)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              description: URL of the restock
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`STOCK_LIMIT_EXCEEDED`: adding the quantity would exceed the supported 32-bit stock count; nothing was recorded.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`IDEMPOTENCY_KEY_REUSED`: this key was already used with a different request body or by another user.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /restocks/{restockId}:
    get:
      tags: [restocks]
      operationId: getRestock
      summary: One recorded restock
      description: Safe. Any authenticated role.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: restockId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The restock
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: List customers
      description: |
        Safe. Any role.
        - Results ordered deterministically by `LOWER(display_name) ASC, id ASC`.
        - Duplicate display names and contacts are explicitly permitted; the UUID is the customer identity.
        - `q` matches case-insensitively against trimmed customer display names.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: q
          in: query
          description: Keyword matched against display name (case-insensitive substring; empty or omitted returns all).
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of customers
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Add a customer
      description: |
        OWNER or ASSISTANT. **Idempotent when `Idempotency-Key` is sent** (v0.2.0, optional):
        - the same key and the same body (after trimming the name, and treating a blank contact as none)
          return 201 with the **original** customer, and nothing new is created, also when the retries
          arrive in parallel;
        - the same key with a different body, or sent by another user, returns 422
          `IDEMPOTENCY_KEY_REUSED`, and nothing is created;
        - keys are kept for the life of the customer.

        Without the header, every call creates a new customer (v0.1.0 behaviour). Two customers may
        share a name; the UUID is the identity.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Customer created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: '`IDEMPOTENCY_KEY_REUSED`: this key was already used with a different body or by another user; nothing was created'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /customers/{customerId}/ledger:
    get:
      tags: [customers]
      operationId: getCustomerLedger
      summary: A customer's ledger with the balance after each entry
      description: |
        Safe. Any role. Credit sales, repayments, reversals and store-credit changes, newest first
        (spec R10). `balanceAfterKobo` is what the customer owed right after the entry;
        `storeCreditAfterKobo` is the store credit they held right after it. A `STORE_CREDIT` entry
        changes store credit only. The newest entry's `balanceAfterKobo` equals `balanceKobo`. Paid
        sales are not ledger entries.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of the customer's ledger
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: Today's sales, low stock and credit owed
      description: |
        Safe. Any role. Every figure is computed from the records when read, never stored (spec R14),
        and the response says when (`computedAt`) and that it is demonstration data. "Today" is the
        Africa/Lagos calendar day (DM14): a sale at 00:30 WAT counts as today. `lowStock` lists up to
        10 active products at or below their threshold, lowest first; `lowStockCount` counts them all.
        `recentSales` lists the 5 newest sales.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The dashboard
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sales:
    get:
      tags: [sales]
      operationId: listSales
      summary: List recorded sales
      description: Safe. Any role. Newest first.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: from
          in: query
          description: Inclusive start date (Africa/Lagos calendar day).
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Inclusive end date (Africa/Lagos calendar day).
          schema:
            type: string
            format: date
        - name: paymentType
          in: query
          schema:
            $ref: '#/components/schemas/PaymentType'
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of sales
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [sales]
      operationId: createSale
      summary: Record a paid or credit sale
      description: |
        **Idempotent via `Idempotency-Key`** (required). OWNER or ASSISTANT.

        In one transaction, each line's stock is reduced only if enough remains
        (`UPDATE … WHERE quantity >= :q`); if any line is short, **nothing** is recorded and
        409 `INSUFFICIENT_STOCK` names the product. Two devices selling the last unit at the
        same moment produce exactly one sale.

        Client's part: generate one UUID when the user taps Confirm, keep it until a 201, 409
        or 422 arrives, and resend the **same** key on timeout or network loss. Show "Not
        confirmed" (never "Saved") until 201.
        
        Further rules: a product may appear in only one line, and `dueDate` is allowed only on a
        CREDIT sale (both 400 `VALIDATION_FAILED`); an unknown or archived product, or an unknown customer, is 404 `NOT_FOUND` naming the field;
        the response lists lines ordered by `productId`; a replay with the same lines in a
        different order counts as the same body.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCreate'
            examples:
              paid:
                summary: Paid sale of two products
                value:
                  paymentType: PAID
                  lines:
                    - productId: 3f1c2a9e-6b7d-4c1e-9a52-0d8e4f6a1b23
                      quantity: 2
                    - productId: 7a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                      quantity: 1
              credit:
                summary: Credit sale with a due date
                value:
                  paymentType: CREDIT
                  customerId: 9c8b7a6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d
                  dueDate: '2026-11-15'
                  lines:
                    - productId: 3f1c2a9e-6b7d-4c1e-9a52-0d8e4f6a1b23
                      quantity: 1
      responses:
        '201':
          description: Sale recorded (or the original result of a replayed key)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              description: URL of the sale
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`INSUFFICIENT_STOCK`: at least one line exceeds available stock; nothing was recorded. `detail` names the product and `availableQuantity` is given in `errors`.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://stockwise.example/problems/insufficient-stock
                title: Not enough stock
                status: 409
                code: INSUFFICIENT_STOCK
                detail: Only 0 of "Peak Milk 400g" left.
                requestId: 2b6f0c3e-8d4a-4f6b-9e1a-5c7d8e9f0a1b
                errors:
                  - field: lines[0].quantity
                    message: 'availableQuantity: 0'
        '422':
          description: '`IDEMPOTENCY_KEY_REUSED`: this key was already used with a different request body'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /sales/{saleId}:
    get:
      tags: [sales]
      operationId: getSale
      summary: One sale with its lines
      description: Safe. Any role.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: saleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The sale
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from `POST /auth/sessions`; valid 8 hours. Role is re-checked on every request.

  headers:
    RequestId:
      description: Echo of the request's `X-Request-Id` (or one generated by the service).
      schema:
        type: string
        format: uuid

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Client-generated UUID used to trace one action across both tiers.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, one per user attempt; reused on retry.
      schema:
        type: string
        format: uuid
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional client-generated UUID, one per user attempt; reuse it on retry to make the call safe to repeat.
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: '`VALIDATION_FAILED`: the request is malformed; `errors` lists each field (including non-integer money or quantities).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: '`UNAUTHENTICATED`: missing, invalid or expired token, or wrong email/password.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: '`FORBIDDEN`: the user''s role may not perform this action.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: '`NOT_FOUND`: the resource (or a referenced product or customer) does not exist.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: '`DATABASE_UNAVAILABLE`: the service is up but cannot reach the database.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Kobo:
      description: Amount in kobo (integer). ₦450.00 = 45000.
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      x-unit: kobo

    Role:
      type: string
      enum: [OWNER, ASSISTANT, ADMIN]

    PaymentType:
      type: string
      enum: [PAID, CREDIT]

    StockState:
      description: IN_STOCK = above threshold; LOW = at or below threshold and above 0; OUT = 0; ARCHIVED = inactive.
      type: string
      enum: [IN_STOCK, LOW, OUT, ARCHIVED]

    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        code:
          type: string
          description: |
            Machine-readable error code the interface acts on. `VALIDATION_FAILED` is also sent
            with status 405 (method not allowed) and 415 (unsupported content type).
            `INTERNAL_ERROR` (500) means an unexpected failure; quote the `requestId` when reporting it.
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - DUPLICATE_REFERENCE
            - INSUFFICIENT_STOCK
            - STOCK_LIMIT_EXCEEDED
            - IDEMPOTENCY_KEY_REUSED
            - DATABASE_UNAVAILABLE
            - INTERNAL_ERROR
        requestId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [UP, DEGRADED]
        service:
          type: string
          const: stockwise
        version:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true

    Session:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    ProductCreate:
      type: object
      required: [reference, name, category, priceKobo, quantity, lowStockThreshold]
      additionalProperties: false
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 40
          description: Shop's own product code; unique.
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 60
        priceKobo:
          $ref: '#/components/schemas/Kobo'
        quantity:
          type: integer
          format: int32
          minimum: 0
          description: Opening stock (units).
        lowStockThreshold:
          type: integer
          format: int32
          minimum: 0

    Product:
      type: object
      required: [id, reference, name, category, priceKobo, quantity, lowStockThreshold, stockState, active, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        name:
          type: string
        category:
          type: string
        priceKobo:
          $ref: '#/components/schemas/Kobo'
        quantity:
          type: integer
          format: int32
          minimum: 0
        lowStockThreshold:
          type: integer
          format: int32
          minimum: 0
        stockState:
          $ref: '#/components/schemas/StockState'
        active:
          type: boolean
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64

    RestockCreate:
      type: object
      required: [productId, quantity, receivedOn]
      additionalProperties: false
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        receivedOn:
          type: string
          format: date
        note:
          type: string
          maxLength: 500

    Restock:
      type: object
      required: [id, productId, quantity, receivedOn, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
        receivedOn:
          type: string
          format: date
        note:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    RestockPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Restock'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64

    MovementSourceType:
      description: What caused the movement. Reversal types arrive with reversals (R11).
      type: string
      enum: [OPENING, SALE, SALE_REVERSAL, RESTOCK, RESTOCK_REVERSAL]

    Movement:
      type: object
      required: [id, delta, sourceType, quantityAfter, createdAt]
      properties:
        id:
          type: string
          format: uuid
        delta:
          type: integer
          format: int32
          description: Units added (positive) or removed (negative). Never 0.
        sourceType:
          $ref: '#/components/schemas/MovementSourceType'
        sourceId:
          type: string
          format: uuid
          description: The sale, restock or reversal that caused it. Absent for OPENING.
        quantityAfter:
          type: integer
          format: int32
          description: The product's quantity right after this movement.
        createdAt:
          type: string
          format: date-time

    MovementPage:
      type: object
      required: [productId, currentQuantity, items, page, size, totalItems]
      properties:
        productId:
          type: string
          format: uuid
        currentQuantity:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/Movement'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64

    LedgerSourceType:
      description: What caused the ledger entry. REPAYMENT and REVERSAL arrive with those features (R9, R11).
      type: string
      enum: [CREDIT_SALE, REPAYMENT, REVERSAL, STORE_CREDIT]

    LedgerEntry:
      type: object
      required: [id, sourceType, deltaKobo, balanceAfterKobo, storeCreditAfterKobo, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sourceType:
          $ref: '#/components/schemas/LedgerSourceType'
        sourceId:
          type: string
          format: uuid
          description: The sale, repayment or reversal behind the entry, when there is one.
        deltaKobo:
          type: integer
          format: int64
          x-unit: kobo
          description: Change to the balance owed, or to store credit for a STORE_CREDIT entry. Never 0; may be negative.
        balanceAfterKobo:
          $ref: '#/components/schemas/Kobo'
        storeCreditAfterKobo:
          $ref: '#/components/schemas/Kobo'
        createdAt:
          type: string
          format: date-time

    LedgerPage:
      type: object
      required: [customerId, balanceKobo, storeCreditKobo, items, page, size, totalItems]
      properties:
        customerId:
          type: string
          format: uuid
        balanceKobo:
          $ref: '#/components/schemas/Kobo'
        storeCreditKobo:
          $ref: '#/components/schemas/Kobo'
        items:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64

    Dashboard:
      type: object
      required: [computedAt, isDemonstrationData, today, todaySales, outstandingCreditKobo, customersOwing,
                 storeCreditHeldKobo, lowStockCount, lowStock, recentSales]
      properties:
        computedAt:
          type: string
          format: date-time
        isDemonstrationData:
          type: boolean
          const: true
        today:
          type: string
          format: date
          description: The Africa/Lagos calendar day the "today" figures cover.
        todaySales:
          type: object
          required: [count, totalKobo, paidCount, paidKobo, creditCount, creditKobo]
          properties:
            count:
              type: integer
              format: int32
            totalKobo:
              $ref: '#/components/schemas/Kobo'
            paidCount:
              type: integer
              format: int32
            paidKobo:
              $ref: '#/components/schemas/Kobo'
            creditCount:
              type: integer
              format: int32
            creditKobo:
              $ref: '#/components/schemas/Kobo'
        outstandingCreditKobo:
          $ref: '#/components/schemas/Kobo'
        customersOwing:
          type: integer
          format: int32
        storeCreditHeldKobo:
          $ref: '#/components/schemas/Kobo'
        lowStockCount:
          type: integer
          format: int32
        lowStock:
          type: array
          maxItems: 10
          items:
            type: object
            required: [id, reference, name, quantity, lowStockThreshold]
            properties:
              id:
                type: string
                format: uuid
              reference:
                type: string
              name:
                type: string
              quantity:
                type: integer
                format: int32
              lowStockThreshold:
                type: integer
                format: int32
        recentSales:
          type: array
          maxItems: 5
          items:
            type: object
            required: [id, reference, paymentType, totalKobo, createdAt]
            properties:
              id:
                type: string
                format: uuid
              reference:
                type: string
              paymentType:
                $ref: '#/components/schemas/PaymentType'
              totalKobo:
                $ref: '#/components/schemas/Kobo'
              createdAt:
                type: string
                format: date-time
    CustomerCreate:
      type: object
      required: [displayName]
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        contactPlaceholder:
          type: string
          maxLength: 60
          description: Fictional contact text only (demonstration data).

    Customer:
      type: object
      required: [id, displayName, balanceKobo, storeCreditKobo, hasDebtActivity, hasStoreCreditActivity, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        contactPlaceholder:
          type: string
        balanceKobo:
          $ref: '#/components/schemas/Kobo'
        storeCreditKobo:
          $ref: '#/components/schemas/Kobo'
        hasDebtActivity:
          type: boolean
          description: Whether this customer has any debt-ledger history, independently of the current balance.
        hasStoreCreditActivity:
          type: boolean
          description: Whether this customer has any store-credit-ledger history, independently of the current balance.
        createdAt:
          type: string
          format: date-time

    CustomerPage:
      type: object
      required: [items, page, size, totalItems, asOf]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        asOf:
          type: string
          format: date-time
          description: UTC timestamp when the page was queried and balances evaluated.

    SaleLineCreate:
      type: object
      required: [productId, quantity]
      additionalProperties: false
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000

    SaleCreate:
      type: object
      required: [paymentType, lines]
      additionalProperties: false
      description: |
        A CREDIT sale **requires** `customerId` (the service returns 400 `VALIDATION_FAILED`
        otherwise, backed by a database CHECK). A PAID sale may omit it.
      properties:
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        customerId:
          type: string
          format: uuid
        dueDate:
          type: string
          format: date
          description: Optional; CREDIT sales only.
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/SaleLineCreate'

    SaleLine:
      type: object
      required: [productId, productName, quantity, unitPriceKobo, lineTotalKobo]
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
        unitPriceKobo:
          $ref: '#/components/schemas/Kobo'
        lineTotalKobo:
          $ref: '#/components/schemas/Kobo'

    Sale:
      type: object
      required: [id, reference, paymentType, totalKobo, lines, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          description: Human-readable sale number, e.g. S-000123.
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        customerId:
          type: string
          format: uuid
        dueDate:
          type: string
          format: date
        totalKobo:
          $ref: '#/components/schemas/Kobo'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SaleLine'
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    SalePage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sale'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
