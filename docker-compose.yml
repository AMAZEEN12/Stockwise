# Local Postgres 17 (N15). Healthy: "db ... Started".
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockwise
      POSTGRES_USER: stockwise
      POSTGRES_PASSWORD: stockwise
    ports:
      - "5432:5432"
    volumes:
      - stockwise-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockwise -d stockwise"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  stockwise-db:
