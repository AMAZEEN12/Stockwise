# The gate (deploy-plan §2, release.md). Runs on every PR and push, and is called by deploy.yml.
# A red job here means nothing deploys.
name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]   # main is gated by deploy.yml, which calls this workflow
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guards:
    name: Guards (frozen migration, undo script, contract log, test edits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Frozen migration and missing undo script
        env: { BASE_REF: "origin/${{ github.base_ref }}" }
        run: .github/scripts/check-migrations.sh "$BASE_REF"
      - name: Contract change needs a decisions.md line
        env: { BASE_REF: "origin/${{ github.base_ref }}" }
        run: .github/scripts/check-contract-log.sh "$BASE_REF"
      - name: No test edits during a fix
        env:
          BASE_REF: "origin/${{ github.base_ref }}"
          HEAD_BRANCH: ${{ github.head_ref }}
        run: .github/scripts/check-test-guard.sh "$BASE_REF" "$HEAD_BRANCH"
      - name: Evidence branch is never merged
        env: { HEAD_BRANCH: "${{ github.head_ref }}" }
        run: |
          if [ "$HEAD_BRANCH" = "evidence/no-stock-guard" ]; then
            echo "::error::evidence/no-stock-guard exists only to show the concurrency test failing. Never merge it."; exit 1
          fi

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  contract:
    name: Contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes @redocly/cli@2 lint contract/openapi.yaml --config contract/redocly.yaml

  service:
    name: Service (build, unit, Testcontainers, migrations up/down/up)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25, cache: maven }
      - name: ./mvnw verify
        working-directory: service
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-test-reports
          path: |
            service/target/surefire-reports
            service/target/failsafe-reports
          if-no-files-found: ignore

  web:
    name: Web (lint, typecheck, test, build, Playwright + axe)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright (journeys, axe, 360 px)
        run: npx playwright test
        env: { CI: "true" }
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
        env: { VITE_API_BASE_URL: "http://localhost:8080/api/v1" }
